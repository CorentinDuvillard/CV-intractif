<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporting Annuel 2025 — Tableau de Bord</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>

*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f3ee;--bg2:#f2eae0;--bg3:#ebe3d7;--bg4:#e3d9cc;
  --text:#4d4237;--text2:#7a6e62;--text3:#a89a8c;
  --accent:#8b6f4e;--accent2:#b08d65;--accent-light:#d4c3a8;
  --green:#5a7a3a;--green-bg:#e8eed8;--green-light:#f0f5e6;
  --red:#9e4a3a;--red-bg:#f5ddd8;
  --amber:#9e7520;--amber-bg:#f5ecd4;
  --border:#e0d5c7;--border2:#d1c4b2;
  --card:#fffdf9;--card-hover:#faf6f0;
  --shadow:0 1px 3px rgba(77,66,55,0.06),0 4px 12px rgba(77,66,55,0.04);
  --shadow-lg:0 2px 8px rgba(77,66,55,0.08),0 8px 24px rgba(77,66,55,0.06);
  --shadow-xl:0 4px 16px rgba(77,66,55,0.10),0 16px 48px rgba(77,66,55,0.08);
  --radius:10px;--radius-lg:14px;--radius-xl:20px;
}
html{font-size:15px;scroll-behavior:smooth}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:44px}

.legal-footer{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--border);text-align:center;padding:10px 16px;font-size:11px;color:var(--text3);z-index:1000;font-family:'DM Sans',system-ui,sans-serif}

/* ═══ UPLOAD SCREEN ═══ */
#uploadScreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;position:relative;overflow:hidden}
#uploadScreen::before{content:'';position:absolute;top:-20%;right:-10%;width:50vw;height:50vw;background:radial-gradient(circle,rgba(176,141,101,0.08) 0%,transparent 70%);pointer-events:none}
#uploadScreen::after{content:'';position:absolute;bottom:-15%;left:-10%;width:40vw;height:40vw;background:radial-gradient(circle,rgba(90,122,58,0.05) 0%,transparent 70%);pointer-events:none}

.upload-brand{text-align:center;margin-bottom:40px;position:relative;z-index:1}
.upload-brand h1{font-family:'Playfair Display';font-size:clamp(28px,4vw,42px);font-weight:600;color:var(--text);letter-spacing:-0.02em;margin-bottom:6px}
.upload-brand p{font-size:14px;color:var(--text3);font-weight:300}

.drop-zone{
  width:100%;max-width:700px;min-height:280px;
  border:2px dashed var(--border2);border-radius:var(--radius-xl);
  background:var(--card);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding:40px;
  cursor:pointer;transition:all 0.3s;position:relative;z-index:1;
}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--accent);background:rgba(139,111,78,0.03);box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.drop-zone.dragover{border-style:solid;background:rgba(139,111,78,0.06)}
.drop-icon{font-size:48px;opacity:0.3;line-height:1}
.drop-title{font-family:'Playfair Display';font-size:18px;font-weight:500;color:var(--text)}
.drop-sub{font-size:13px;color:var(--text3);text-align:center;max-width:400px;line-height:1.6}
.drop-btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;padding:10px 24px;border-radius:8px;font-size:13px;font-family:'DM Sans';font-weight:500;cursor:pointer;transition:all 0.2s;margin-top:4px}
.drop-btn:hover{background:#7a6040;transform:translateY(-1px);box-shadow:var(--shadow)}
.btn-template{display:inline-flex;align-items:center;gap:8px;background:var(--green-bg);color:var(--green);border:1px solid rgba(90,122,58,0.3);padding:10px 24px;border-radius:8px;font-size:13px;font-family:'DM Sans';font-weight:500;cursor:pointer;transition:all 0.2s;margin-top:4px}
.btn-template:hover{background:var(--green-light);transform:translateY(-1px);box-shadow:var(--shadow)}

.file-list{width:100%;max-width:700px;margin-top:20px;display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.file-item{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;animation:fadeUp 0.3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.file-info{display:flex;align-items:center;gap:10px}
.file-icon{width:32px;height:32px;background:var(--green-bg);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--green)}
.file-name{font-size:13px;font-weight:500;color:var(--text)}
.file-size{font-size:11px;color:var(--text3)}
.file-remove{background:none;border:none;font-size:16px;color:var(--text3);cursor:pointer;padding:4px 8px;border-radius:4px;transition:all 0.15s}
.file-remove:hover{color:var(--red);background:var(--red-bg)}

.generate-section{width:100%;max-width:700px;margin-top:24px;display:flex;flex-direction:column;align-items:center;gap:12px;position:relative;z-index:1}
.btn-generate{background:linear-gradient(135deg,#4d4237,#6b5a4a);color:#f7f3ee;border:none;padding:14px 48px;border-radius:var(--radius);font-size:15px;font-family:'DM Sans';font-weight:600;cursor:pointer;transition:all 0.3s;letter-spacing:0.02em;box-shadow:var(--shadow-lg)}
.btn-generate:hover{transform:translateY(-2px);box-shadow:var(--shadow-xl)}
.btn-generate:disabled{opacity:0.4;cursor:not-allowed;transform:none;box-shadow:none}

.log-box{width:100%;max-width:700px;margin-top:16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;font-size:11px;color:var(--text2);max-height:200px;overflow-y:auto;display:none;position:relative;z-index:1}
.log-box.visible{display:block}
.log-line{padding:2px 0;border-bottom:1px solid rgba(224,213,199,0.4)}
.log-line.error{color:var(--red)}
.log-line.success{color:var(--green)}
.log-line.warn{color:var(--amber)}

/* ═══ REPORT SCREEN ═══ */
#reportScreen{display:none}
.report-header{background:linear-gradient(135deg,#4d4237 0%,#6b5a4a 50%,#8b6f4e 100%);padding:48px 40px 42px;color:#f7f3ee;position:relative;overflow:hidden}
.report-header::before{content:'';position:absolute;top:0;right:0;width:40%;height:100%;background:radial-gradient(ellipse at 80% 30%,rgba(176,141,101,0.2) 0%,transparent 70%)}
.report-header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(212,195,168,0.4),transparent)}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;flex-wrap:wrap;gap:12px}
.header-badge{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent-light);border:1px solid rgba(212,195,168,0.3);padding:4px 12px;border-radius:20px}
.header-year{font-family:'Playfair Display';font-size:clamp(32px,5vw,52px);font-weight:600;letter-spacing:-0.02em;line-height:1.1;margin:16px 0 6px;position:relative;z-index:1}
.header-sub{font-size:14px;font-weight:300;color:rgba(247,243,238,0.7);letter-spacing:0.02em}
.header-period{font-size:12px;color:rgba(247,243,238,0.5);margin-top:4px}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn-back,.btn-export{background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:#f7f3ee;padding:8px 18px;border-radius:8px;font-size:12px;font-family:'DM Sans';cursor:pointer;transition:all 0.2s}
.btn-back:hover,.btn-export:hover{background:rgba(255,255,255,0.2)}

.container{max-width:1240px;margin:0 auto;padding:28px 24px 48px}

.tab-bar{display:flex;gap:4px;margin-bottom:24px;background:var(--bg2);border-radius:var(--radius);padding:4px;overflow-x:auto}
.tab-btn{padding:10px 20px;border:none;background:none;font-family:'DM Sans';font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;border-radius:8px;transition:all 0.2s;white-space:nowrap}
.tab-btn:hover{color:var(--text);background:rgba(255,255,255,0.5)}
.tab-btn.active{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.tab-content{display:none}
.tab-content.active{display:block;animation:fadeUp 0.3s ease}

.section-title{font-family:'Playfair Display';font-size:17px;font-weight:500;color:var(--text);letter-spacing:0.01em;margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.section-title span{font-family:'DM Sans';font-size:11px;font-weight:400;color:var(--text3);margin-left:8px;letter-spacing:0.04em}

.kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:32px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;box-shadow:var(--shadow);transition:transform 0.2s,box-shadow 0.2s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.kpi-label{font-size:11px;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px}
.kpi-value{font-family:'Playfair Display';font-size:28px;font-weight:600;color:var(--text)}
.kpi-value.green{color:var(--green)}.kpi-value.amber{color:var(--amber)}.kpi-value.red{color:var(--red)}
.kpi-sub{font-size:10px;color:var(--text3);margin-top:4px}

.chart-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow);margin-bottom:28px}
.chart-wrap{position:relative;height:260px}
.legend-row{display:flex;gap:20px;margin-bottom:10px;font-size:12px;color:var(--text2)}
.legend-dot{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}

.rank-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px}
.rank-table{width:100%;border-collapse:collapse}
.rank-table th{text-align:left;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;padding:8px 12px;border-bottom:2px solid var(--border)}
.rank-table td{padding:10px 12px;border-bottom:1px solid rgba(224,213,199,0.5);font-size:13px}
.rank-table tr:hover td{background:var(--bg2)}
.rank-badge{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:11px;font-weight:600}
.rank-1{background:#d4c3a8;color:#4d4237}.rank-2{background:var(--bg3);color:var(--text2)}.rank-3{background:var(--bg2);color:var(--text3)}

.person-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;margin-bottom:28px}
.person-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;cursor:pointer;transition:all 0.2s;box-shadow:var(--shadow)}
.person-card:hover{border-color:var(--border2);box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.avatar{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
.card-name{font-family:'Playfair Display';font-size:15px;font-weight:500;color:var(--text)}
.card-zone{font-size:11px;color:var(--text3);margin-top:2px}
.stat-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.stat-box{background:var(--bg2);border-radius:8px;padding:10px;text-align:center}
.stat-num{font-family:'Playfair Display';font-size:18px;font-weight:600;color:var(--text)}
.stat-lbl{font-size:10px;color:var(--text3);margin-top:2px;text-transform:uppercase;letter-spacing:0.04em}
.fill-bar{height:4px;background:var(--bg3);border-radius:2px;overflow:hidden;margin:8px 0}
.fill-bar-inner{height:100%;border-radius:2px;transition:width 0.6s ease}
.note-box{background:var(--amber-bg);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:11px;color:#6b5520;line-height:1.5}

.week-list{display:flex;flex-direction:column;gap:8px}
.week-item{border-left:3px solid var(--border);padding:10px 14px;border-radius:0 8px 8px 0;background:var(--bg);transition:all 0.15s}
.week-item:hover{background:var(--bg2)}
.week-item.has-vente{border-left-color:var(--green)}
.week-date{font-size:11px;color:var(--text3);margin-bottom:4px;font-weight:500;text-transform:uppercase;letter-spacing:0.04em}
.week-content{font-size:12px;color:var(--text);line-height:1.5}
.week-sales{font-size:11px;color:var(--accent);margin-top:4px;font-style:italic}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:12px;font-size:10px;font-weight:500;margin-right:4px;margin-bottom:4px}
.badge.action{background:var(--bg2);color:var(--accent)}
.badge.vente{background:var(--green-light);color:var(--green)}

.report-footer{text-align:center;padding:24px;font-size:11px;color:var(--text3);border-top:1px solid var(--border);margin-top:12px}

.month-table{width:100%;border-collapse:collapse;margin-bottom:28px;background:var(--card);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow)}
.month-table th{text-align:left;font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:0.06em;padding:10px 14px;border-bottom:2px solid var(--border);background:var(--bg2)}
.month-table td{padding:10px 14px;border-bottom:1px solid rgba(224,213,199,0.4);font-size:13px}
.month-table tr:hover td{background:var(--bg)}
.month-table tfoot td{font-weight:600;border-top:2px solid var(--border);background:var(--bg2)}

.progress-overlay{position:fixed;inset:0;background:rgba(247,243,238,0.92);display:none;align-items:center;justify-content:center;z-index:999;flex-direction:column;gap:16px;backdrop-filter:blur(4px)}
.progress-overlay.visible{display:flex}
.progress-spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.progress-text{font-size:14px;color:var(--text2)}

@media(max-width:768px){
  .kpi-row{grid-template-columns:repeat(2,1fr)}.person-grid{grid-template-columns:1fr}
  .report-header{padding:32px 20px 28px}.container{padding:20px 14px 36px}
  .rank-grid{grid-template-columns:1fr}
}
@media(max-width:480px){.kpi-row{grid-template-columns:1fr}}

#uploadScreen{display:none!important}
#reportScreen{display:block!important}
</style>
</head>
<body>

<div id="reportScreen">
  <div class="report-header">
    <div class="header-top">
      <div>
        <div class="header-badge">Rapport confidentiel</div>
        <div class="header-year" id="rptTitle"></div>
        <div class="header-sub">Performance commerciale — Équipe Conseillers</div>
        <div class="header-period" id="rptPeriod"></div>

      <div class="header-actions">
        <button class="btn-export" onclick="exportHTML()">⤓ Exporter HTML</button>
      </div>
    </div>
  </div>
  <div class="container">
    <div class="tab-bar" id="tabBar"></div>
    <div id="tabContents"></div>
  </div>
  <div class="report-footer" id="rptFooter"></div>
</div>

<div class="legal-footer">© 2026 — Corentin Duvillard. Tous droits réservés.</div>

function computeKPI(advisorData, colorIdx) {
  const entries = advisorData.entries.map(e => ({
    ...e,
    weekDate: new Date(e.weekDate),
  }));
  const filled = entries.filter(w => w.filled);
  const totalWeeksInTemplate = entries.length;
  const filledWeeksTotal = filled.length;

  // 2025 is past year
  const expectedWeeksToDate = entries.length;
  const filledElapsedWeeks = filledWeeksTotal;
  const fillRateToDate = expectedWeeksToDate > 0 ? Math.min(100, Math.round((filledElapsedWeeks / expectedWeeksToDate) * 100)) : 0;

  const totalContacts = filled.reduce((s, w) => s + w.contactsTotaux, 0);
  const totalVentes = filled.reduce((s, w) => s + w.ventesTotales, 0);
  const conv = totalContacts > 0 ? ((totalVentes / totalContacts) * 100).toFixed(1) : '0';
  const avgCpW = filledWeeksTotal > 0 ? (totalContacts / filledWeeksTotal).toFixed(1) : '0';
  const avgVpW = filledWeeksTotal > 0 ? (totalVentes / filledWeeksTotal).toFixed(2) : '0';

  const months = {};
  filled.forEach(w => {
    const key = `${w.year}-${String(w.month + 1).padStart(2, '0')}`;
    if (!months[key]) months[key] = { contacts: 0, ventes: 0, weeks: 0, label: MONTH_NAMES[w.month] + ' ' + w.year };
    months[key].contacts += w.contactsTotaux;
    months[key].ventes += w.ventesTotales;
    months[key].weeks++;
  });
  const sortedMonths = Object.entries(months).sort((a, b) => a[0].localeCompare(b[0]));

  const alerts = [];
  if (fillRateToDate < 80) alerts.push(`Taux de remplissage faible (${fillRateToDate} %)`);
  if (filledWeeksTotal > 0) {
    const firstMonth = Math.min(...filled.map(w => w.month));
    const lastMonth = Math.max(...filled.map(w => w.month));
    const emptyMonths = [];
    for (let m = firstMonth; m <= lastMonth; m++) {
      const yr = filled[0].year;
      const key = `${yr}-${String(m + 1).padStart(2, '0')}`;
      if (!months[key]) emptyMonths.push(MONTH_NAMES[m]);
    }
    if (emptyMonths.length) alerts.push(`Mois sans données : ${emptyMonths.join(', ')}`);
  }

  const color = COLORS[colorIdx % COLORS.length];
  const initials = advisorData.name.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
  const fillRateNote = `Année complète (${totalWeeksInTemplate} sem.)`;

  return {
    name: advisorData.name,
    entries, weeks: filled, allEntries: entries,
    totalWeeksInTemplate, expectedWeeksToDate, filledElapsedWeeks,
    expectedWeeks: expectedWeeksToDate, filledWeeks: filledElapsedWeeks,
    fillRate: fillRateToDate, fillRateNote,
    totalContacts, totalVentes, conv, avgCpW, avgVpW,
    sortedMonths, alerts, color, initials
  };
}

function renderReport(sellers) {
  // Detect year from data
  const allYears = sellers.flatMap(s => s.entries.map(e => e.weekDate.getFullYear()));
  const reportYear = allYears.length ? Math.max(...new Set(allYears)) : new Date().getFullYear();
  const title = `Reporting Hebdomadaire ${reportYear}`;
  const today = new Date();

  document.getElementById('rptTitle').textContent = title;
  document.getElementById('rptPeriod').textContent = `Année ${reportYear} · ${sellers.length} conseiller${sellers.length > 1 ? 's' : ''} · Taux calculé sur les semaines échues au ${today.toLocaleDateString('fr-FR')}`;
  document.getElementById('rptFooter').textContent = `${title} · Données consolidées · Document à usage interne`;

  const tC = sellers.reduce((s, v) => s + v.totalContacts, 0);
  const tV = sellers.reduce((s, v) => s + v.totalVentes, 0);
  const tF = sellers.reduce((s, v) => s + v.filledWeeks, 0);
  const tE = sellers.reduce((s, v) => s + v.expectedWeeks, 0);
  const aF = tE > 0 ? Math.round((tF / tE) * 100) : 0;
  const cG = tC > 0 ? ((tV / tC) * 100).toFixed(1) : '0';
  const avgCGlobal = tF > 0 ? (tC / tF).toFixed(1) : '0';
  const avgVGlobal = tF > 0 ? (tV / tF).toFixed(2) : '0';

  const tabBar = document.getElementById('tabBar');
  const tabC = document.getElementById('tabContents');
  tabBar.innerHTML = `<button class="tab-btn active" data-tab="global">Vue d'ensemble</button>`;
  sellers.forEach((s, i) => { tabBar.innerHTML += `<button class="tab-btn" data-tab="s${i}">${s.name.split(' ')[0]}</button>`; });
  tabBar.onclick = e => {
    const b = e.target.closest('.tab-btn'); if (!b) return;
    tabBar.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    tabC.querySelectorAll('.tab-content').forEach(x => x.classList.remove('active'));
    const t = document.getElementById('tab-' + b.dataset.tab);
    if (t) t.classList.add('active');
  };

  let H = `<div class="tab-content active" id="tab-global">`;
  H += `<div class="section-title">Indicateurs clés <span>consolidé · semaines échues</span></div>`;
  H += `<div class="kpi-row">
    <div class="kpi"><div class="kpi-label">Conseillers</div><div class="kpi-value">${sellers.length}</div></div>
    <div class="kpi"><div class="kpi-label">Semaines renseignées</div><div class="kpi-value">${tF} / ${tE}</div><div class="kpi-sub">sur semaines échues</div></div>
    <div class="kpi"><div class="kpi-label">Contacts</div><div class="kpi-value">${tC.toLocaleString('fr-FR')}</div><div class="kpi-sub">moy. ${avgCGlobal} / sem.</div></div>
    <div class="kpi"><div class="kpi-label">Ventes</div><div class="kpi-value green">${tV}</div><div class="kpi-sub">conversion ${cG} %</div></div>
    <div class="kpi"><div class="kpi-label">Remplissage</div><div class="kpi-value ${aF >= 90 ? 'green' : aF >= 70 ? 'amber' : 'red'}">${aF} %</div><div class="kpi-sub">sem. échues uniquement</div></div>
    <div class="kpi"><div class="kpi-label">Moy. contacts / sem.</div><div class="kpi-value">${avgCGlobal}</div></div>
    <div class="kpi"><div class="kpi-label">Moy. ventes / sem.</div><div class="kpi-value">${avgVGlobal}</div></div>
  </div>`;

  H += `<div class="section-title">Contacts vs Ventes <span>par conseiller</span></div>
  <div class="chart-card"><div class="legend-row"><span><span class="legend-dot" style="background:var(--accent-light)"></span>Contacts</span><span><span class="legend-dot" style="background:var(--green)"></span>Ventes</span></div><div class="chart-wrap"><canvas id="globalChart"></canvas></div></div>`;

  // Monthly synthesis consolidated
  if (sellers.length > 0) {
    const globalMonths = {};
    sellers.forEach(s => {
      s.sortedMonths.forEach(([key, m]) => {
        if (!globalMonths[key]) globalMonths[key] = { contacts: 0, ventes: 0, weeks: 0, label: m.label };
        globalMonths[key].contacts += m.contacts;
        globalMonths[key].ventes += m.ventes;
        globalMonths[key].weeks += m.weeks;
      });
    });
    const sortedGM = Object.entries(globalMonths).sort((a, b) => a[0].localeCompare(b[0]));
    if (sortedGM.length > 0) {
      H += `<div class="section-title">Synthèse mensuelle <span>consolidé</span></div>`;
      H += `<table class="month-table"><thead><tr><th>Mois</th><th>Semaines renseignées</th><th>Contacts</th><th>Ventes</th><th>Conversion</th></tr></thead><tbody>`;
      let sumC = 0, sumV = 0, sumW = 0;
      sortedGM.forEach(([, m]) => {
        const cv = m.contacts > 0 ? ((m.ventes / m.contacts) * 100).toFixed(1) : '0';
        H += `<tr><td>${m.label}</td><td>${m.weeks}</td><td>${m.contacts}</td><td style="color:var(--green);font-weight:600">${m.ventes}</td><td>${cv} %</td></tr>`;
        sumC += m.contacts; sumV += m.ventes; sumW += m.weeks;
      });
      const sumCv = sumC > 0 ? ((sumV / sumC) * 100).toFixed(1) : '0';
      H += `</tbody><tfoot><tr><td>Total</td><td>${sumW}</td><td>${sumC}</td><td style="color:var(--green)">${sumV}</td><td>${sumCv} %</td></tr></tfoot></table>`;
    }
  }

  // Rankings
  H += `<div class="rank-grid">`;
  const byV = [...sellers].sort((a, b) => b.totalVentes - a.totalVentes);
  H += `<div><div class="section-title">Par ventes</div><table class="rank-table"><thead><tr><th>#</th><th>Conseiller</th><th>Ventes</th><th>Conv.</th></tr></thead><tbody>`;
  byV.forEach((s, i) => { H += `<tr><td><span class="rank-badge ${i < 3 ? 'rank-' + (i + 1) : ''}">${i + 1}</span></td><td>${s.name}</td><td style="font-weight:600;color:var(--green)">${s.totalVentes}</td><td>${s.conv} %</td></tr>`; });
  H += `</tbody></table></div>`;

  const byC = [...sellers].sort((a, b) => b.totalContacts - a.totalContacts);
  H += `<div><div class="section-title">Par contacts</div><table class="rank-table"><thead><tr><th>#</th><th>Conseiller</th><th>Contacts</th><th>Rempl.</th></tr></thead><tbody>`;
  byC.forEach((s, i) => { H += `<tr><td><span class="rank-badge ${i < 3 ? 'rank-' + (i + 1) : ''}">${i + 1}</span></td><td>${s.name}</td><td style="font-weight:600">${s.totalContacts}</td><td>${s.fillRate} %</td></tr>`; });
  H += `</tbody></table></div></div>`;

  // Person cards
  H += `<div class="section-title">Fiches individuelles <span>cliquez sur un onglet pour le détail</span></div><div class="person-grid">`;
  sellers.forEach((s, i) => {
    const fc = s.fillRate >= 95 ? 'var(--green)' : s.fillRate >= 80 ? 'var(--accent)' : 'var(--amber)';
    H += `<div class="person-card" onclick="document.querySelector('[data-tab=s${i}]').click()">
      <div class="card-head"><div class="avatar" style="background:${s.color}18;color:${s.color}">${s.initials}</div><div><div class="card-name">${s.name}</div><div class="card-zone" style="font-size:10px;color:var(--text3)">${s.fillRateNote}</div></div></div>
      <div class="stat-row"><div class="stat-box"><div class="stat-num" style="color:${fc}">${s.filledWeeks}/${s.expectedWeeks}</div><div class="stat-lbl">semaines</div></div><div class="stat-box"><div class="stat-num">${s.totalContacts}</div><div class="stat-lbl">contacts</div></div><div class="stat-box"><div class="stat-num" style="color:${s.totalVentes > 0 ? 'var(--green)' : 'var(--text3)'}">${s.totalVentes}</div><div class="stat-lbl">ventes</div></div></div>
      <div class="fill-bar"><div class="fill-bar-inner" style="width:${s.fillRate}%;background:${fc}"></div></div>
      ${s.alerts.length ? `<div class="note-box">${s.alerts.join(' · ')}</div>` : ''}
    </div>`;
  });
  H += `</div></div>`;

  // Individual tabs
  sellers.forEach((s, idx) => {
    H += `<div class="tab-content" id="tab-s${idx}">`;
    H += `<div style="display:flex;align-items:center;gap:14px;margin-bottom:20px"><div class="avatar" style="background:${s.color}18;color:${s.color};width:52px;height:52px;font-size:16px">${s.initials}</div><div><div style="font-family:'Playfair Display';font-size:22px;font-weight:600">${s.name}</div><div style="font-size:11px;color:var(--text3)">${s.fillRateNote}</div></div></div>`;

    H += `<div class="kpi-row">
      <div class="kpi"><div class="kpi-label">Semaines (échues)</div><div class="kpi-value">${s.filledWeeks}/${s.expectedWeeks}</div><div class="kpi-sub">${s.fillRate} %</div></div>
      <div class="kpi"><div class="kpi-label">Contacts</div><div class="kpi-value">${s.totalContacts}</div><div class="kpi-sub">moy. ${s.avgCpW} / sem.</div></div>
      <div class="kpi"><div class="kpi-label">Ventes</div><div class="kpi-value green">${s.totalVentes}</div><div class="kpi-sub">conv. ${s.conv} %</div></div>
      <div class="kpi"><div class="kpi-label">Moy. ventes / sem.</div><div class="kpi-value">${s.avgVpW}</div></div>
    </div>`;

    if (s.alerts.length) H += `<div class="note-box" style="margin-bottom:20px">⚠ ${s.alerts.join(' · ')}</div>`;

    if (s.sortedMonths.length > 1) {
      H += `<div class="chart-card"><div class="section-title">Évolution mensuelle</div><div class="legend-row"><span><span class="legend-dot" style="background:var(--accent-light)"></span>Contacts</span><span><span class="legend-dot" style="background:var(--green)"></span>Ventes</span></div><div class="chart-wrap"><canvas id="sc${idx}"></canvas></div></div>`;
    }

    if (s.sortedMonths.length > 0) {
      H += `<div class="section-title">Synthèse mensuelle</div>`;
      H += `<table class="month-table"><thead><tr><th>Mois</th><th>Sem.</th><th>Contacts</th><th>Ventes</th><th>Conv.</th></tr></thead><tbody>`;
      s.sortedMonths.forEach(([, m]) => {
        const cv = m.contacts > 0 ? ((m.ventes / m.contacts) * 100).toFixed(1) : '0';
        H += `<tr><td>${m.label}</td><td>${m.weeks}</td><td>${m.contacts}</td><td style="color:var(--green);font-weight:600">${m.ventes}</td><td>${cv} %</td></tr>`;
      });
      H += `</tbody></table>`;
    }

    H += `<div class="section-title">Détail semaine par semaine <span>${s.weeks.length} entrées</span></div><div class="week-list">`;
    s.weeks.forEach(w => {
      const ds = w.weekDate.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' });
      const hv = w.ventesTotales > 0;
      const parts = [w.agencesAnimees, w.actionsCommerciales, w.commentaireActions, w.commentaireGlobal].filter(Boolean);
      const txt = parts.length ? parts.join(' — ') : 'Semaine renseignée';
      let extra = '';
      if (w.venteDetail) extra += `<div class="week-sales">💼 ${w.venteDetail}</div>`;
      if (w.contactsRecus) extra += `<div style="font-size:11px;color:var(--text2);margin-top:3px">📋 ${w.contactsRecus}</div>`;
      if (w.contactsTotaux > 0) extra += `<span class="badge action">${w.contactsTotaux} contact${w.contactsTotaux > 1 ? 's' : ''}</span>`;
      if (w.ventesTotales > 0) extra += `<span class="badge vente">${w.ventesTotales} vente${w.ventesTotales > 1 ? 's' : ''}</span>`;
      H += `<div class="week-item${hv ? ' has-vente' : ''}"><div class="week-date">${w.weekLabel || 'Semaine du ' + ds}</div><div class="week-content">${txt}</div>${extra ? `<div style="margin-top:6px">${extra}</div>` : ''}</div>`;
    });
    H += `</div></div>`;
  });

  tabC.innerHTML = H;

  // Charts
  requestAnimationFrame(() => {
    const gCtx = document.getElementById('globalChart');
    if (gCtx) new Chart(gCtx, {
      type: 'bar',
      data: {
        labels: sellers.map(s => s.name.split(' ')[0]),
        datasets: [
          { label: 'Contacts', data: sellers.map(s => s.totalContacts), backgroundColor: '#d4c3a8', borderRadius: 4, order: 2 },
          { label: 'Ventes', data: sellers.map(s => s.totalVentes), backgroundColor: '#5a7a3a', borderRadius: 4, order: 1 }
        ]
      },
      options: chartOpts()
    });

    sellers.forEach((s, i) => {
      const ctx = document.getElementById(`sc${i}`);
      if (!ctx || s.sortedMonths.length < 2) return;
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: s.sortedMonths.map(([, m]) => m.label.split(' ')[0].substring(0, 4)),
          datasets: [
            { label: 'Contacts', data: s.sortedMonths.map(([, m]) => m.contacts), backgroundColor: '#d4c3a8', borderRadius: 4, order: 2 },
            { label: 'Ventes', data: s.sortedMonths.map(([, m]) => m.ventes), backgroundColor: '#5a7a3a', borderRadius: 4, order: 1 }
          ]
        },
        options: chartOpts()
      });
    });
  });
}

function chartOpts() {
  return {
    responsive: true, maintainAspectRatio: false,
    plugins: {
      legend: { display: false },
      tooltip: { mode: 'index', intersect: false, backgroundColor: '#4d4237', titleFont: { family: 'DM Sans' }, bodyFont: { family: 'DM Sans' }, cornerRadius: 8, padding: 10 }
    },
    scales: {
      x: { grid: { display: false }, ticks: { font: { size: 11, family: 'DM Sans' }, color: '#7a6e62' } },
      y: { grid: { color: 'rgba(77,66,55,0.06)' }, ticks: { font: { size: 11, family: 'DM Sans' }, color: '#a89a8c' } }
    }
  };
}

/* ── EXPORT HTML ── */
function exportHTML() {
  const clone = document.getElementById('reportScreen').cloneNode(true);
  clone.querySelectorAll('.btn-back,.btn-export').forEach(b => b.remove());
  clone.querySelectorAll('.tab-content').forEach(t => { t.style.display = 'block'; });
  clone.querySelector('.tab-bar').style.display = 'none';
  const allYears = document.getElementById('rptTitle').textContent.match(/\d{4}/);
  const yr = allYears ? allYears[0] : new Date().getFullYear();
  const html = `<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><title>Reporting Hebdomadaire ${yr}</title><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"><style>${document.querySelector('style').textContent}\n#reportScreen{display:block!important}.tab-content{display:block!important;page-break-inside:avoid}.tab-bar{display:none!important}</style></head><body>${clone.outerHTML}<div class="legal-footer" style="position:fixed;bottom:0;left:0;right:0;background:#f7f3ee;border-top:1px solid #e0d5c7;text-align:center;padding:10px 16px;font-size:11px;color:#a89a8c;z-index:1000">© 2026 — Corentin Duvillard. Tous droits réservés.</div></body></html>`;
  const blob = new Blob([html], { type: 'text/html' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `reporting-${yr}.html`; a.click(); URL.revokeObjectURL(a.href);
}



// Auto-init
document.addEventListener('DOMContentLoaded', () => {
  const sellers = DEMO_DATA.map((s, i) => computeKPI(s, i));
  sellers.sort((a, b) => b.totalVentes - a.totalVentes);
  renderReport(sellers);
});
</script>
</body>
</html>
